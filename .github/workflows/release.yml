# SPDX-FileCopyrightText: 2026 Files365 contributors
# SPDX-License-Identifier: GPL-2.0-or-later
#
# Builds macOS (.dmg) and Windows (installer .exe) installers and always
# uploads them as workflow artifacts (downloadable by maintainers from the
# Actions tab). Separately, this is about end-user distribution via GitHub
# Releases - unrelated to the client's own in-app update checker, which is
# still documented in docs/SERVER_SETUP.md and needs its own server.
#
# Triggers:
#   - push of a tag matching v*.*.* (e.g. v1.0.0)  -> version comes from the
#     tag; if BOTH platforms build successfully, a GitHub Release is created
#     for that tag with the .dmg and the .exe attached.
#   - manual run from the Actions tab              -> version is 0.0.0-dev;
#     produces artifacts only, never a Release (there is no tag to publish
#     under).
#
# Each platform job is independent (continue-on-error: true) so a failure
# on one platform does not prevent the other from producing its artifact.
# continue-on-error masks the job's real result from `needs.<job>.result`
# (GitHub always reports it as "success" downstream - see
# https://github.com/actions/toolkit/issues/1739), so the publish-release
# job below cannot gate on that. Instead each build job exposes its own
# `success` output, computed from the outcome of its actual packaging step.

name: Release builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  # macOS is built as a universal2 (x86_64 + arm64) binary. Homebrew doesn't
  # ship universal bottles - every formula (qt, qtkeychain, openssl@3, ...)
  # is a single-arch build for whichever arch the runner itself is - so a
  # single `-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"` configure would fail to
  # link (Homebrew's Qt only has one of the two arch slices available).
  # Instead, build-macos-arm64 and build-macos-x86_64 each natively produce a
  # single-arch Files365.app on a matching runner, and build-macos-universal
  # lipo-merges the two into one universal2 .app before packaging the .dmg -
  # the same approach upstream Nextcloud itself uses (see the note at the top
  # of admin/osx/make_universal.py, already in this repo but unused by CI
  # until now).
  build-macos-arm64:
    name: macOS arm64 (build)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (Homebrew)
        run: |
          brew install qt qtkeychain extra-cmake-modules karchive sqlite openssl@3 libp11
          brew install --cask inkscape

      - name: Build and install KDSingleApplication-qt6
        # Not a public Homebrew formula - build it from source (small, fast).
        run: |
          git clone --depth 1 https://github.com/KDAB/KDSingleApplication.git /tmp/kdsingleapplication
          cmake -S /tmp/kdsingleapplication -B /tmp/kdsingleapplication/build \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/kdsingleapplication/build -j "$(sysctl -n hw.ncpu)"
          sudo cmake --install /tmp/kdsingleapplication/build

      - name: Configure
        # macos-latest is Apple Silicon: Homebrew lives at /opt/homebrew, not
        # /usr/local, so CMAKE_PREFIX_PATH must be passed explicitly.
        # openssl@3 is keg-only (never symlinked into the main prefix on
        # either architecture) so it needs its own hint too. PKG_CONFIG_PATH
        # is exported explicitly so pkg_check_modules(libp11) can find the
        # .pc file Homebrew installs, without relying on shell init scripts
        # a CI shell doesn't source.
        # CMAKE_OSX_ARCHITECTURES=arm64: shell_integration/MacOSX/CMakeLists.txt
        # shells out to `xcodebuild ARCHS=${CMAKE_OSX_ARCHITECTURES} ...` to
        # build the Finder Sync extension. Left unset, that expands to
        # "ARCHS=" (empty), so Xcode builds for zero architectures and every
        # binary it was supposed to produce is silently missing. macos-latest
        # is Apple Silicon, hence arm64 (build-macos-x86_64 below is the
        # x86_64 counterpart, on an Intel runner).
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_OWNCLOUD_OSX_BUNDLE=ON \
                -DBUILD_TESTING=OFF \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
                -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
                -DFILES365_RELEASE_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        # Must build nextcloudcmd alongside nextcloud, not just nextcloud:
        # src/gui/CMakeLists.txt runs macdeployqt as a POST_BUILD step on the
        # "nextcloud" target with "-executable=.../files365cmd" pointing at
        # nextcloudcmd's output binary. If nextcloudcmd was never built, that
        # path doesn't exist yet, so macdeployqt's rpath fixups on it fail
        # (logged as "install_name_tool: can't open file" - non-fatal to the
        # step, but leaves the bundle inconsistent). Building both up front
        # makes the bundle correct.
        run: cmake --build build --target nextcloud --target nextcloudcmd -j "$(sysctl -n hw.ncpu)"

      - name: Archive app bundle (tar, not a raw directory)
        # build/bin/Files365.app: BIN_OUTPUT_DIRECTORY (CMakeLists.txt) is
        # "${CMAKE_BINARY_DIR}/bin", and the bundle is named after
        # APPLICATION_NAME (NEXTCLOUD.cmake) - "Files365.app".
        #
        # actions/upload-artifact dereferences symlinks when uploading a
        # directory path - confirmed by inspecting a real run's downloaded
        # artifact: every .framework's Versions/Current (normally a symlink
        # to Versions/A) came back as a second real copy of the directory,
        # and each framework's top-level convenience symlinks (e.g.
        # QtLabsPlatform -> Versions/Current/QtLabsPlatform) came back as
        # duplicated real files. That non-standard layout is exactly what
        # made codesign fail later with "bundle format is ambiguous (could
        # be app or framework)" on QtLabsPlatform.framework. tar preserves
        # symlinks natively, so archive the bundle into one file and upload
        # that instead - the artifact transport can't mangle bytes inside an
        # opaque tarball the way it mangles a directory tree.
        run: tar -czf Files365.app.tar.gz -C build/bin Files365.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: files365-macos-app-arm64-${{ steps.ver.outputs.version }}
          path: Files365.app.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-macos-x86_64:
    name: macOS x86_64 (build)
    # A real Intel runner, not Rosetta-emulated Homebrew on Apple Silicon:
    # Homebrew's own formulae are single-arch bottles built for the host,
    # so this is the only way to get a genuine x86_64 Qt/qtkeychain/etc to
    # link against, matching how build-macos-arm64 gets a genuine arm64 Qt.
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies (Homebrew)
        run: |
          brew install qt qtkeychain extra-cmake-modules karchive sqlite openssl@3 libp11
          brew install --cask inkscape

      - name: Build and install KDSingleApplication-qt6
        # Not a public Homebrew formula - build it from source (small, fast).
        run: |
          git clone --depth 1 https://github.com/KDAB/KDSingleApplication.git /tmp/kdsingleapplication
          cmake -S /tmp/kdsingleapplication -B /tmp/kdsingleapplication/build \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/kdsingleapplication/build -j "$(sysctl -n hw.ncpu)"
          sudo cmake --install /tmp/kdsingleapplication/build

      - name: Configure
        # macos-15-intel Homebrew lives at /usr/local, same prefix
        # CMAKE_PREFIX_PATH is set to below - kept explicit (rather than
        # relying on the default search path) so this step matches
        # build-macos-arm64's Configure step line for line except for
        # CMAKE_OSX_ARCHITECTURES. openssl@3 is keg-only on every arch, so
        # it needs its own hint too. See build-macos-arm64's Configure step
        # for why CMAKE_OSX_ARCHITECTURES must be set explicitly at all.
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/share/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_OWNCLOUD_OSX_BUNDLE=ON \
                -DBUILD_TESTING=OFF \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
                -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
                -DFILES365_RELEASE_VERSION=${{ steps.ver.outputs.version }}

      - name: Build
        # See build-macos-arm64's Build step for why nextcloudcmd must be
        # built alongside nextcloud.
        run: cmake --build build --target nextcloud --target nextcloudcmd -j "$(sysctl -n hw.ncpu)"

      - name: Archive app bundle (tar, not a raw directory)
        # See build-macos-arm64's Archive step for why this must be a tar
        # file rather than uploading build/bin/Files365.app as a directory.
        run: tar -czf Files365.app.tar.gz -C build/bin Files365.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: files365-macos-app-x86_64-${{ steps.ver.outputs.version }}
          path: Files365.app.tar.gz
          retention-days: 1
          if-no-files-found: error

  build-macos-universal:
    name: macOS (.dmg, universal2)
    needs: [build-macos-arm64, build-macos-x86_64]
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      success: ${{ steps.resign.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job doesn't build anything and needs nothing from git
          # history (unlike build-macos-arm64/x86_64, which run CMake
          # configure) - only the current admin/osx/make_universal.py.
          sparse-checkout: |
            admin/osx

      - name: Derive release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: files365-macos-app-arm64-${{ steps.ver.outputs.version }}
          path: arm64_dl

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: files365-macos-app-x86_64-${{ steps.ver.outputs.version }}
          path: x86_64_dl

      - name: Extract app bundles
        # Confirmed by inspecting a real run's download: actions/download-
        # artifact (or upload-artifact on the way in) dereferences symlinks
        # inside an uploaded directory, turning each .framework's
        # Versions/Current (normally a symlink to Versions/A) into a second
        # real copy of the directory, and top-level convenience symlinks
        # (e.g. QtLabsPlatform -> Versions/Current/QtLabsPlatform) into
        # duplicated real files - a non-standard bundle layout that made the
        # later Re-sign step fail with "bundle format is ambiguous (could be
        # app or framework)". build-macos-arm64/x86_64 now upload a tarball
        # instead (tar preserves symlinks natively), so unpack that here.
        run: |
          mkdir arm64 x86_64
          tar -xzf arm64_dl/Files365.app.tar.gz -C arm64
          tar -xzf x86_64_dl/Files365.app.tar.gz -C x86_64
          test -f arm64/Files365.app/Contents/Info.plist
          test -f x86_64/Files365.app/Contents/Info.plist
          # Guard against this exact bug regressing silently.
          test -L arm64/Files365.app/Contents/Frameworks/QtLabsPlatform.framework/Versions/Current
          test -L x86_64/Files365.app/Contents/Frameworks/QtLabsPlatform.framework/Versions/Current

      - name: Merge into a universal2 .app (lipo)
        # admin/osx/make_universal.py is upstream Nextcloud's own script for
        # this exact merge (see its module docstring: macdeployqt can't
        # produce a universal bundle directly, so build both arches
        # separately and lipo them together after the fact). It copies the
        # arm64 bundle as the base, then walks it replacing every Mach-O
        # file with a `lipo -create` of the arm64 + x86_64 versions -
        # non-executable resources (Info.plist, icons, qml, translations)
        # are identical between the two arch builds and are left as-is from
        # the arm64 copy; symlinks (e.g. a framework's Versions/Current) are
        # skipped and resolve through to whichever real file they point at.
        run: |
          python3 admin/osx/make_universal.py x86_64/Files365.app arm64/Files365.app universal
          # Contents/MacOS/Files365, not files365: the macOS bundle target's
          # OUTPUT_NAME is APPLICATION_NAME (capital F, src/gui/CMakeLists.txt),
          # unlike Windows which uses lowercase APPLICATION_EXECUTABLE.
          lipo -info universal/Files365.app/Contents/MacOS/Files365

      - name: Re-sign app bundle (lipo invalidates the per-bundle signature seal)
        id: resign
        # `codesign --verify --deep --strict` fails with "a sealed resource
        # is missing or invalid" on the merged bundle: lipo overwrote every
        # Mach-O binary/framework in place (see the Merge step above), which
        # invalidates the seal each one had from its original single-arch
        # build - on Apple Silicon that's not just a Gatekeeper warning, the
        # kernel refuses to load a binary whose signature doesn't match its
        # contents. This is the same class of bug the single-arch build-macos
        # job hit before (CPack's DragNDrop staging invalidating macdeployqt's
        # signature after the fact), so re-sign after the last step that
        # touches the bundle's files too - here, that's this job's own Merge
        # step, since packaging below is a plain `cp -a` of the already-final
        # universal/Files365.app with nothing added or rewritten afterwards.
        #
        # Signed here, directly on disk, rather than inside a mounted dmg
        # (which is how the single-arch job did it, since CPack had already
        # built the dmg by the time re-signing was possible there): a first
        # attempt signing inside a mounted dmg hit "internal error in Code
        # Signing subsystem" on libicudata.78.dylib (a ~65MB universal data
        # blob, the largest single file in the merge) that a byte-identical
        # local repro of the same codesign invocation outside a disk image
        # did not reproduce - consistent with known flakiness in `--deep`
        # signing large bundles over a mounted disk image on some macOS
        # versions. Retried below as defense in depth regardless of cause.
        #
        # This is still only an ad-hoc signature (no paid Apple Developer ID
        # / notarization) - end users downloading the .dmg via a browser will
        # still see Gatekeeper's "Apple could not verify this app is free of
        # malware" prompt (expected for any unsigned/ad-hoc app) and need to
        # right-click > Open once. That's the same, pre-existing tradeoff as
        # the previous single-arch build, not a regression - true
        # zero-warning distribution requires enrolling in the Apple
        # Developer Program and notarizing via notarytool, a separate
        # decision for the maintainers.
        run: |
          set -e
          for attempt in 1 2 3; do
            if codesign --force --deep --sign - universal/Files365.app \
               && codesign --verify --deep --strict universal/Files365.app; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "codesign failed 3 times, giving up" >&2
              exit 1
            fi
            echo "codesign attempt $attempt failed, retrying..." >&2
            sleep 5
          done

      - name: Package (.dmg)
        # Mirrors NextcloudCPack.cmake's DragNDrop settings (CPACK_DMG_FORMAT
        # UDBZ, CPACK_DMG_VOLUME_NAME "${APPLICATION_SHORTNAME}") by hand,
        # since CPack itself isn't usable here - it drives its own build+
        # install from a single CMake tree and has no notion of a
        # pre-merged, already-built universal .app to package as-is. Comes
        # after signing (unlike the equivalent single-arch/CPack step this
        # replaced) since packaging here is just `cp -a` + a symlink, which
        # doesn't touch universal/Files365.app's own contents and so can't
        # invalidate a signature already on it.
        run: |
          mkdir dmgroot build
          cp -a universal/Files365.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname Files365 -srcfolder dmgroot -format UDBZ -ov \
                          "build/Files365-${{ steps.ver.outputs.version }}-macOS.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: files365-macos-${{ steps.ver.outputs.version }}
          path: build/Files365-*.dmg
          retention-days: 90
          if-no-files-found: error

  build-windows:
    name: Windows (installer)
    # Pinned (not windows-latest): as of this writing windows-latest points
    # to Windows Server 2025 / Visual Studio 2026, which Craft's
    # windows-msvc2022_64-cl target below does not detect. windows-2022
    # ships VS2022, matching CRAFT_TARGET - same pin already used by
    # windows-build-and-test.yml elsewhere in this repo.
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 90
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    outputs:
      version: ${{ steps.ver.outputs.version }}
      success: ${{ steps.collect.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup MSVC dev environment
        # Puts cl.exe/link.exe etc. on PATH (via GITHUB_ENV/GITHUB_PATH) so
        # every later step's shell inherits it - Craft's Visual Studio
        # detection needs this active before it runs.
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install inkscape
        # cmake/modules/GenerateIconsUtils.cmake find_program()s inkscape
        # (or rsvg-convert) to rasterize the app icon SVGs at configure
        # time - same package windows-build-and-test.yml already installs.
        shell: pwsh
        run: choco install inkscape --no-progress

      - name: Work around craft-blueprints-nextcloud os.path.join() NameError
        # craft-blueprints-nextcloud@stable-34.0's nextcloud-client.py calls
        # os.path.join() in createPackage() without importing the os module,
        # so "craft --package" always crashes with "NameError: name 'os' is
        # not defined" right after the actual packaging work has already
        # succeeded. Patching the checked-out blueprint file directly doesn't
        # stick: every single CraftMaster invocation resets its blueprint
        # repos' working trees (confirmed - each of the six `craft ...` calls
        # below prints a "HEAD is now at ..." checkout), which wipes any local
        # edit before "craft --package" runs. Instead, inject a sitecustomize
        # module that makes the standard `os` module resolve as a builtin, so
        # bare `os.path.join(...)` succeeds even in a module that forgot to
        # import it - this survives blueprint resets since it lives outside
        # the blueprint checkout entirely. Remove once upstream fixes it.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\_ci_sitecustomize" | Out-Null
          $sitecustomize = "import builtins`nimport os`nbuiltins.os = os`n"
          Set-Content -Path "${{ github.workspace }}\_ci_sitecustomize\sitecustomize.py" -Value $sitecustomize -NoNewline
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHONPATH=${{ github.workspace }}\_ci_sitecustomize"

      - name: Setup Craft, install deps, compile and package
        shell: pwsh
        run: |
          git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }}

          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }

          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-34.0|"
          # Fork of craft-blueprints-nextcloud@stable-34.0, not upstream:
          # upstream's nextcloud-client/blacklist.txt has a "strip most
          # executables" rule - a negative-lookahead regex that deletes every
          # .exe from the packaged installer except nextcloud/nextcloudcmd/
          # QtWebEngineProcess. This fork's real binaries are files365.exe
          # and files365cmd.exe (APPLICATION_EXECUTABLE in NEXTCLOUD.cmake),
          # which never matched, so the app's own executable was silently
          # dropped while every DLL still got bundled normally (matched by
          # unrelated rules) - confirmed by extracting a real built
          # installer's payload: 2167 files, zero of them .exe. This fork
          # just adds files365/files365cmd to that regex's allowlist - see
          # https://github.com/Luisduran12/craft-blueprints-nextcloud/commit/b99a3ce
          craft --add-blueprint-repository "https://github.com/Luisduran12/craft-blueprints-nextcloud.git|stable-34.0-files365|"
          craft craft
          craft --install-deps nextcloud-client
          craft --src-dir ${{ github.workspace }} --options nextcloud-client.srcDir=${{ github.workspace }} nextcloud-client

          # Tee (not just run) the packaging step: craft-blueprints-nextcloud's
          # createPackage() does NOT use this repo's NextcloudCPack.cmake/CPack
          # NSIS config at all - it 7-zips the installed tree and feeds it
          # through its own NSIS wrapper, then makensis prints a line of the
          # exact form `Output: "<path>\nextcloud-client-<branch>-windows-<compiler>-<arch>.exe"`.
          # That file name/location is Craft's own internal naming (blueprint
          # id + branch + compiler + arch), NOT "${APPLICATION_SHORTNAME}-
          # ${CPACK_PACKAGE_VERSION}-setup" from NextcloudCPack.cmake, and it
          # is NOT the same directory windows-build-and-test.yml uses for
          # ctest - confirmed by inspecting a real run's log (it lands in
          # "...\<CRAFT_TARGET>\tmp\", not "...\build\nextcloud-client\work\build\").
          # A previous fix here guessed at that CPack name/path from static
          # analysis and was wrong - CPack's config in this repo is simply
          # unused by the Craft-driven pipeline. Parsing craft's own reported
          # "Output:" line instead of hardcoding a name/path keeps this
          # correct even if blueprint naming (branch/compiler/arch) changes.
          python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c --package nextcloud-client 2>&1 |
            Tee-Object -FilePath "${{ github.workspace }}\craft-package.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect installer(s)
        id: collect
        shell: pwsh
        run: |
          $packageLog = "${{ github.workspace }}\craft-package.log"

          # makensis's own summary line, e.g.:
          #   Output: "D:\...\windows-msvc2022_64-cl\tmp\nextcloud-client-latest-master-windows-cl-msvc2022-x86_64.exe"
          $match = Select-String -Path $packageLog -Pattern 'Output:\s*"([^"]+\.exe)"' -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $match) {
            Write-Error "No NSIS 'Output: ...' line found in craft-package.log - packaging failed or its output format changed. Last 100 log lines:"
            Get-Content $packageLog -Tail 100
            exit 1
          }

          $installerPath = $match.Matches[0].Groups[1].Value
          if (-not (Test-Path $installerPath)) {
            Write-Error "craft-package.log reported the installer at '$installerPath' but that file does not exist."
            exit 1
          }

          $installer = Get-Item $installerPath
          $sizeMB = [math]::Round($installer.Length / 1MB, 1)
          Write-Host "Found installer: $($installer.FullName) ($sizeMB MB)"
          # A real NSIS installer for this app bundles Qt + all its
          # dependencies and is tens of MB; anything tiny is almost
          # certainly a truncated/corrupt build, not a working installer.
          if ($installer.Length -lt 10MB) {
            Write-Error "$($installer.Name) is only $sizeMB MB - looks truncated/corrupt, refusing to publish it."
            exit 1
          }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Re-named on copy so the artifact end users download is clearly
          # labelled, independent of Craft's internal blueprint/branch/
          # compiler-derived file name.
          Copy-Item -Path $installer.FullName -Destination "dist\Files365-${{ steps.ver.outputs.version }}-setup.exe" -Force

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: files365-windows-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-universal, build-windows]
    # Only ever runs off a version tag (workflow_dispatch has no tag to
    # publish under) and only when BOTH platforms' actual packaging step
    # succeeded - see the outputs.success comment on each build job above
    # for why this can't just be needs.<job>.result.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build-macos-universal.outputs.success == 'true' && needs.build-windows.outputs.success == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: files365-*
          merge-multiple: true

      - name: Verify both installers were downloaded
        run: |
          ls -la dist
          ls dist/*.dmg
          ls dist/*.exe

      - uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Files365 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.exe
